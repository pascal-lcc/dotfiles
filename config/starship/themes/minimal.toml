format = """$directory$git_branch$git_status$nodejs$rust$golang$character"""

[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
symbol = " "
style = "bold magenta"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
