# example: /usr/shae/doc/tmux/examples/
# {{{ screen-keys.conf
# $Id: screen-keys.conf,v 1.7 2010/07/31 11:39:13 nicm Exp $
#
# By Nicholas Marriott. Public domain.
#
# This configuration file binds many of the common GNU screen key bindings to
# appropriate tmux key bindings. Note that for some key bindings there is no
# tmux analogue and also that this set omits binding some commands available in
# tmux but not in screen.
#
# Note this is only a selection of key bindings and they are in addition to the
# normal tmux key bindings. This is intended as an example not as to be used
# as-is.


# Set the prefix to ^A.
set -g prefix C-a
unbind C-b
#bind C-a send-prefix
bind a send-prefix

# Bind appropriate commands similar to screen.
# lockscreen ^X x
unbind ^X
bind ^X lock-server
unbind L
bind L lock-server

# screen ^C c
unbind ^C
bind ^C new-window
bind t new-window

# detach ^D d
unbind ^D
bind d detach

# displays *
unbind *
bind * list-clients

# next ^@ ^N sp n
unbind ^@
bind ^@ next-window
unbind ^N
bind ^N next-window
#unbind " "
#bind " " next-window
unbind n
bind n next-window

# title A
unbind A
bind A command-prompt "rename-window %%"

# other ^A
unbind ^A
bind ^A last-window

# prev ^H ^P p ^?
unbind ^H

bind ^H previous-window
unbind ^P
bind ^P previous-window
unbind p
bind p previous-window
unbind BSpace
bind BSpace previous-window

# windows ^W w
unbind W
bind W choose-tree -w
unbind w
bind w list-windows

# quit \
unbind \
bind \ confirm-before "kill-server"

# kill K k
#unbind K
#bind K confirm-before "kill-window"
#unbind k
#bind k confirm-before "kill-window"

# redisplay ^L l
unbind ^L
bind ^L refresh-client
unbind l
bind l refresh-client

# split -v |
unbind |
bind | split-window

# :kB: focus up
unbind Tab
bind Tab select-pane -t:.+
unbind BTab
bind BTab select-pane -t:.-

# " windowlist -b
unbind '"'
bind '"' choose-window
# }}}
# {{{ vim-keys.conf
# $Id: vim-keys.conf,v 1.2 2010/09/18 09:36:15 nicm Exp $
#
# vim-keys.conf, v1.2 2010/09/12
#
# By Daniel Thau.  Public domain.
#
# This configuration file binds many vi- and vim-like bindings to the
# appropriate tmux key bindings.  Note that for many key bindings there is no
# tmux analogue.  This is intended for tmux 1.3, which handles pane selection
# differently from the previous versions


# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind S choose-session
bind s split-window -v
bind v split-window -h

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes like vim
# feel free to change the "1" to however many lines you want to resize by, only
# one at a time can be slow
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt



#set -g default-terminal "xterm" # + "tmux -2" => 256 color
set -g status-left " "
set -g status-justify left
set -g status-right " "
set -g status-interval 15 # 15 sec refresh
set -g display-time 3000
set -g status-bg black
set -g status-fg green
bind b set-option status


set-window-option -g window-status-current-style fg="colour45",bg="colour11"

# set-window-option -g xterm-keys on
setw -g xterm-keys on

set -g status-left-length 15
set -g status-right-length 55
set -g status-left "#[fg=white,bg=blue]#S #[default] |" # session-name
#set -g status-right "#[fg=red,bright][ #[fg=cyan]#H #[fg=red]]#[default] #[fg=yellow,bright]- %Y.%m.%d #[fg=green]%H:%M #[default]#[fg=magenta,bright]#[default]"
#set -g status-right "#[fg=yellow,bright]"
setw -g window-status-current-format "#{?window_zoomed_flag,#[fg=red]#[bg=yellow][#I:#W],#[fg=black]#[bg=yellow] #I:#W }"
set -g history-limit 99999


bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

#bind K confirm-before "kill-window"
bind X confirm-before -p "kill-pane #P? (y/n)" kill-pane


# vi Style Editing
setw -g mode-keys vi

# Vi copypaste mode
bind -T copy-mode-vi 'y' send-keys -X copy-selection
# 綁定 v 開始字元選取 (左右移動)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# 綁定 V 開始整行選取
bind-key -T copy-mode-vi V send-keys -X select-line

# 綁定 C-v (Ctrl+v) 開始區塊選取 (矩形選取)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y 複製到系統剪貼簿
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "printf '\033]52;c;%s\a' \"\$(base64 | tr -d '\n')\" > /dev/tty"
#bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "printf '\033]52;c;$(base64 | tr -d \"\r\n\")\007'"

# 選取後不要自動跳轉到最底部
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDown1Pane

# [左鍵選取]：複製但不清除高亮，也不退出 copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# [左鍵點擊]：只做「取消高亮」，但不退出 copy-mode (這能解決誤觸退出)
bind-key -T copy-mode-vi MouseDown1Pane send-keys -X clear-selection

# [右鍵貼上]：這裡要分兩個地方設
# (1) 一般模式下右鍵：直接貼上
bind-key -n MouseDown3Pane paste-buffer

# (2) Copy-mode 下右鍵：取消選取狀態 -> 退出 copy-mode -> 貼上
bind-key -T copy-mode-vi MouseDown3Pane select-pane \; send-keys -X cancel \; paste-buffer
# bind -n M-Right next-window
# bind -n M-Left previous-window

#setw -g monitor-activity on
setw -g monitor-activity off
set -g visual-activity on
set -g focus-events on

## scroll buff use mouse
#bind m set -g mouse on \; display 'Mouse Mode: ON'
#bind M set -g mouse off \; display 'Mouse Mode: OFF'
bind M set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# Make mouse useful in copy mode
#setw -g mode-mouse on

# Allow mouse to select which pane to use
#set -g mouse-select-pane on
set -g mouse on

# 關閉視窗後自動重新編號
set -g renumber-windows on
set -g base-index 1           # 視窗編號從 1 開始 (鍵盤比較好按)
setw -g pane-base-index 1     # 面板編號也從 1 開始

# Allow xterm titles in terminal window, terminal scrolling with scrollbar, and setting overrides of C-Up, C-Down, C-Left, C-Right

#set -g terminal-overrides "xterm*:XT:smcup@:rmcup@:kUP5=\eOA:kDN5=\eOB:kLFT5=\eOD:kRIT5=\eOC"

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on



# save buff to file
bind M-w send-keys c\; save-buffer /tmp/tmux-buffer\; run-shell "reattach-to-user-namespace -l bash -c 'cat /tmp/tmux-buffer|pbcopy'"



bind  -n   M-1 select-window -t :1
bind  -n   M-2 select-window -t :2
bind  -n   M-3 select-window -t :3
bind  -n   M-4 select-window -t :4
bind  -n   M-5 select-window -t :5
bind  -n   M-6 select-window -t :6
bind  -n   M-7 select-window -t :7
bind  -n   M-8 select-window -t :8
bind  -n   M-9 select-window -t :9



