bind d run-shell "printf '\033Ptmux;\033\033]1337;SetUserVar=PROG=\007\033\\\\' > #{pane_tty}; tmux detach"
set -g command-alias[101] 'detach=run-shell "printf \"\\033Ptmux;\\033\\033]1337;SetUserVar=PROG=\\007\\033\\\\\" > #{pane_tty}; tmux detach-client"'
## 修正後
set -g status-right "#{?@pane_ctx, [#{@pane_ctx}], [Shell]}"
# set-hook -g pane-title-changed 'run-shell "tmux set-option -p @pane_ctx \"#{pane_title}\""'
set-hook -g pane-title-changed {
    run-shell ' \
        title="#{pane_title}"; \
        tty="#{pane_tty}"; \
        target="#{pane_id}"; \
        \# echo "[$(date)] Title changed to: $title (TTY: $tty)" >> /tmp/tmux_hook.log; \
        case "$title" in \
            [#]*) \
                content="${title#?}"; \
                tmux set-option -p -t "${target}" @pane_ctx "${content}"; \
                tmux set-option -p -t "${target}" @pane_ctx_b64 \"\"; \
                \# echo "A - Found #, Saved Ctx[ $target]: $content" >> /tmp/tmux_hook.log; \
                ;; \
            *) \
                printf "\033Ptmux;\033\033]2;%s\007\033\\" "$title" > "$tty" ; \
                \# echo "BB - No # $title" >> /tmp/tmux_hook.log; \
                ;; \
        esac
    '
}


