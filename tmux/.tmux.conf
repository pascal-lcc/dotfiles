set-option -g command-alias[100] 'sync_wez=run-shell " \
    ctx=\"#{?@pane_ctx,#{@pane_ctx},#{pane_command}}\"; \
    b64=\"#{?@pane_ctx_b64,#{@pane_ctx_b64},}\"; \
    \
    if [ -z \"\$b64\" ]; then \
        b64=\$(echo -n \"\$ctx\" | base64 | tr -d \"\\n\\r \"); \
        tmux set-option -p @pane_ctx_b64 \"\$b64\"; \
    fi; \
    \
    printf \"\\033Ptmux;\\033\\033]1337;SetUserVar=PROG=%s\\007\\033\\\\\" \"\$b64\" > \"#{pane_tty}\"; \
    \# echo \"[$(date)] DEBUG: Shell_ctx=[$ctx] | Direct_Tmux_ctx=[#{?@pane_ctx,#{@pane_ctx},#{pane_command}}] | TTY=[#{pane_tty}]\" >> /tmp/tmux_hook.log; \
"'
set-hook -ug pane-focus-in
set-hook -g pane-focus-in sync_wez
set-option -g @tmux_sync_active "1"

