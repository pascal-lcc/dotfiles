# 允許外部程式設定剪貼簿
set -s set-clipboard on

# 1. 基礎身分定義 (避免噴出 WezTerm 查詢亂碼)
set -g default-terminal "tmux-256color"

# 2. 解決 nvim 的 Esc 鍵延遲 (非常重要！)
set -s escape-time 50

# 3. 修正顏色與支援 TrueColor (讓 nvim 依然漂亮)
set -ag terminal-overrides ",xterm*:Tc"
# set -ag terminal-overrides ",xterm*:Tc:SyncCtx=\E]1337;SetUserVar=pane_ctx=%p1%s\a"
# set -as terminal-overrides ',xterm*:Tc:SetUserVar=\E]1337;SetUserVar=%p1%s=%p2%s\a'
#set -as terminal-overrides ',xterm*:Tc:Sixel:Ms'

# 4. 啟用剪貼簿連動 (讓你在 tmux 複製的東西能貼到 Windows/Mac)
#set -as terminal-features ",xterm-256color:clipboard"
set -as terminal-features ",xterm*:RGB:clipboard:sixel"

# 3. 核心：開啟穿透與擴展特性
set -g allow-passthrough on
# 讓圖形刷新更平滑，防止圖片被後面的文字閃爍覆蓋
set -g visual-activity off
#
# 5. 開啟穿透模式
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment WEZTERM_PANE
#



bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1
bind M-j join-pane 
bind M-J join-pane -h
# detech pane prefex+!

# 設定標記 (Marked) 面板的樣式
# bg 是背景色，fg 是前景色 (文字顏色)
set -g mode-style "fg=black,bg=orange"
# 當一個 Pane 被標記時，改變其邊框顏色
set -g pane-active-border-style "fg=blue"  # 平時活躍的邊框
# set -g window-style 'fg=colour247,bg=colour236'
